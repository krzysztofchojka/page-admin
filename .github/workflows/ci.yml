name: CMS CI/CD Tests & Release

on:
  push:
    branches: ["main", "master", "test-ci"]
  pull_request:
    branches: ["main", "master", "test-ci"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mbstring, pdo, pdo_mysql, zip
          tools: composer

      - name: Install Dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-progress

      - name: Check PHP Syntax (Linting)
        run: find src/ public/ -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=512M

      - name: Start PHP Built-in Server & Setup DB
        env:
          DB_PASSWORD: root
        run: |
          cat <<EOF > .env
          DB_HOST=127.0.0.1
          DB_NAME=cms_test
          DB_USER=root
          DB_PASS=root
          APP_ENV=testing
          APP_KEY="base64:testkey123456789012345678901234="
          EOF

          while ! mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD} --silent; do
            echo "Czekam na MySQL..."
            sleep 2
          done

          php -S 127.0.0.1:8000 -t public public/index.php > /dev/null 2>&1 &
          sleep 3

          echo "Budowanie tabel bazy..."
          curl -s http://127.0.0.1:8000/install

      - name: Run E2E Security Tests
        run: php tests/e2e.php

  build-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP for Production
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Install Production PHP Dependencies (No Dev)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Setup Node.js (for Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build CSS
        run: |
          npm install
          npm run build

      - name: Prepare Release Folders
        run: |
          # -------------------------------------------------------------
          # 1. BUDOWA STANDARDOWA (Dla hostingów z wyborem DocumentRoot)
          # -------------------------------------------------------------
          mkdir release_standard
          cp -r src release_standard/
          cp -r public release_standard/
          cp -r vendor release_standard/
          cp .env.example release_standard/
          cp README.md release_standard/
          cp .htaccess release_standard/ 2>/dev/null || true

          mkdir -p release_standard/public/uploads/media
          mkdir -p release_standard/public/uploads/secure
          mkdir -p release_standard/public/cache
          mkdir -p release_standard/logs
          chmod -R 775 release_standard/public/uploads release_standard/public/cache release_standard/logs

          # -------------------------------------------------------------
          # 2. BUDOWA "SHARED" (Dla hostingów wymuszających public_html / htdocs)
          # -------------------------------------------------------------
          mkdir release_shared
          cp -r src release_shared/
          cp -r public release_shared/
          cp -r vendor release_shared/
          cp .env.example release_shared/
          cp README.md release_shared/

          mkdir -p release_shared/public/uploads/media
          mkdir -p release_shared/public/uploads/secure
          mkdir -p release_shared/public/cache
          mkdir -p release_shared/logs
          chmod -R 775 release_shared/public/uploads release_shared/public/cache release_shared/logs

          # Stworzenie specjalnego .htaccess w głównym folderze dla InfinityFree
          cat << 'EOF' > release_shared/.htaccess
          <IfModule mod_rewrite.c>
              RewriteEngine On

              # 1. Jeśli plik istnieje w /public, pokaż go bez ładowania PHP
              RewriteCond %{DOCUMENT_ROOT}/public/%{REQUEST_URI} -f [OR]
              RewriteCond %{DOCUMENT_ROOT}/public/%{REQUEST_URI} -d
              RewriteRule ^(.*)$ public/$1 [L]

              # 2. W przeciwnym razie wyślij ruch do routera
              RewriteCond %{REQUEST_URI} !^/public/
              RewriteRule ^(.*)$ public/index.php [L]

              # 3. Zabezpieczenie katalogów systemowych
              RewriteRule ^src/.*$ - [F,L]
              RewriteRule ^vendor/.*$ - [F,L]
              RewriteRule ^\.env$ - [F,L]
          </IfModule>
          EOF

      - name: Create ZIP Archives
        run: |
          # Flaga -rX wyklucza atrybuty Linuxowe, czyniąc plik przyjaznym dla Windows
          cd release_standard
          zip -rX ../cms-standard-build.zip .

          cd ../release_shared
          zip -rX ../cms-shared-hosting-build.zip .

      - name: Upload Standard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-standard-build
          path: cms-standard-build.zip
          retention-days: 30

      - name: Upload Shared Hosting Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-shared-hosting-build
          path: cms-shared-hosting-build.zip
          retention-days: 30
