name: CMS CI/CD Tests & Release

on:
  push:
    branches: ["main", "master", "test-ci"]
  pull_request:
    branches: ["main", "master", "test-ci"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mbstring, pdo, pdo_mysql, zip
          tools: composer

      - name: Install Dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-progress

      - name: Check PHP Syntax (Linting)
        run: find src/ public/ -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=512M

      - name: Start PHP Built-in Server & Setup DB
        env:
          DB_PASSWORD: root
        run: |
          cat <<EOF > .env
          DB_HOST=127.0.0.1
          DB_NAME=cms_test
          DB_USER=root
          DB_PASS=root
          APP_ENV=testing
          APP_KEY="base64:testkey123456789012345678901234="
          EOF

          while ! mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD} --silent; do
            echo "Czekam na MySQL..."
            sleep 2
          done

          php -S 127.0.0.1:8000 -t public public/index.php > /dev/null 2>&1 &
          sleep 3

          echo "Budowanie tabel bazy..."
          curl -s http://127.0.0.1:8000/install

      - name: Run E2E Security Tests
        run: php tests/e2e.php

  # ZADANIE 2: GENEROWANIE PACZKI PRODUKCYJNEJ (Zostanie uruchomione tylko jeśli testy z zadania wyżej przejdą pomyślnie)
  build-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' # Buduj ZIPa tylko na głównych gałęziach

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP for Production
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Install Production PHP Dependencies (No Dev)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Setup Node.js (for Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build CSS
        run: |
          npm install
          npm run build

      - name: Prepare Release Folder
        run: |
          mkdir release_build

          # Kopiujemy tylko to, co potrzebne na serwerze produkcyjnym
          cp -r src release_build/
          cp -r public release_build/
          cp -r vendor release_build/
          cp .env.example release_build/
          cp README.md release_build/
          cp .htaccess release_build/ 2>/dev/null || true # Kopiuj jeśli istnieje

          # Upewniamy się, że struktura katalogów dla uploadów i cache istnieje
          mkdir -p release_build/public/uploads/media
          mkdir -p release_build/public/uploads/secure
          mkdir -p release_build/public/cache
          mkdir -p release_build/logs

          # Wymuszamy domyślne uprawnienia dla folderów dynamicznych (opcjonalne, większość hostingów poradzi sobie z tym sama)
          chmod -R 775 release_build/public/uploads release_build/public/cache release_build/logs

      - name: Create ZIP Archive
        run: |
          cd release_build
          zip -r ../cms-production-build.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-production-build
          path: cms-production-build.zip
          retention-days: 30 # Przechowuj plik na GitHubie przez 30 dni
